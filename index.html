<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Medições">
<meta name="format-detection" content="telephone=no">
<title>Medições · Lift EPI × Energisa</title>
<link rel="icon" type="image/png" href="">
<style>
:root{
  --cy:#0FA9D1; --cy-d:#0A7FA2; --cy-l:#E2F5FA;
  --or:#F47B20; --or-d:#B85A0F; --or-l:#FFF0E3;
  --gr:#1FB84A; --gr-d:#12803A; --gr-l:#E2F7E9;
  --ink:#14232B; --mut:#64767F; --line:#E3EAEE; --bg:#F2F6F8; --card:#fff;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg{display:block}

/* ---------- Cabeçalho ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
  padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px;max-width:640px;margin:0 auto}
.top img{display:block;width:auto}
.top img.l{height:40px}
.top img.e{height:30px}
.strip{height:3px;background:linear-gradient(90deg,var(--gr) 0 33.3%,var(--cy) 33.3% 66.6%,var(--or) 66.6%)}

.wrap{max-width:640px;margin:0 auto;padding:18px 16px calc(130px + var(--safe-b))}
.ttl{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 14px}
.ttl h1{font-size:22px;letter-spacing:-.02em}
.ttl small{color:var(--mut);font-size:13px}
.adm-tag{display:inline-flex;align-items:center;gap:6px;background:var(--gr-l);color:var(--gr-d);
  font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}

/* ---------- Resumo ---------- */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:22px 22px 20px;
  background:
   radial-gradient(180px 140px at 105% 110%,rgba(244,123,32,.75),transparent 70%),
   radial-gradient(160px 120px at -8% -10%,rgba(31,184,74,.45),transparent 70%),
   linear-gradient(135deg,#0A7FA2,#0FA9D1);
  box-shadow:0 14px 30px -14px rgba(10,127,162,.7)}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.pill{font-size:12px;font-weight:600;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px}
.hero-val{font-size:38px;font-weight:800;letter-spacing:-.03em;margin:6px 0 18px;font-variant-numeric:tabular-nums}
.prog-bar{height:12px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.prog-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7CF0A5,#fff);
  transition:width .8s cubic-bezier(.2,.8,.2,1)}
.prog.over .prog-bar i{background:linear-gradient(90deg,#FFC38F,#fff)}
.prog-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.prog-meta b{font-size:18px}
.prog-meta span{opacity:.92}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 1px 2px rgba(20,35,43,.05),0 6px 16px -10px rgba(20,35,43,.18)}
.stat{position:relative}
.stat small{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:13px;font-weight:600}
.stat strong{display:block;font-size:21px;margin:8px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;color:var(--mut);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.cy{background:var(--cy)}.dot.or{background:var(--or)}.dot.gr{background:var(--gr)}
.deliv{margin-top:12px}
.deliv .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.deliv h3{font-size:15px}
.deliv b.v{font-size:18px;font-variant-numeric:tabular-nums}
.mini{height:6px;border-radius:9px;background:#E6EDF0;overflow:hidden}
.mini i{display:block;height:100%;background:var(--gr);border-radius:9px;transition:width .5s}
.deliv .mini{height:9px;margin:12px 0}
.chips3{display:flex;gap:8px;flex-wrap:wrap}
.chips3 span{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:99px}
.c-a{background:var(--or-l);color:var(--or-d)}
.c-p{background:var(--cy-l);color:var(--cy-d)}
.c-t{background:var(--gr-l);color:var(--gr-d)}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:16px}
.note-over{margin-top:8px;color:var(--or-d);font-size:12.5px;font-weight:600}

/* ---------- Medições ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.list{display:grid;gap:12px}
.med{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(20,35,43,.05),0 6px 16px -10px rgba(20,35,43,.18);overflow:hidden;border:1.5px solid transparent;transition:border-color .2s}
.med.open{border-color:#CBE9F2}
.med-head{padding:16px;cursor:pointer;outline:none}
.med-head:focus-visible{box-shadow:inset 0 0 0 2px var(--cy)}
.row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.date{font-size:13px;color:var(--mut);font-weight:600}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap}
.st-a{background:var(--or-l);color:var(--or-d)}
.st-p{background:var(--cy-l);color:var(--cy-d)}
.st-t{background:var(--gr-l);color:var(--gr-d)}
.med h3{font-size:17px;line-height:1.3;margin:10px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.med.open h3{-webkit-line-clamp:unset}
.row2{display:flex;align-items:flex-end;gap:14px}
.row2 .a{flex:1}
.row2 small{display:block;color:var(--mut);font-size:12.5px;margin-bottom:2px}
.row2 b{font-size:19px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.row2 .b{flex:1.1}
.chev{color:var(--mut);transition:transform .25s;flex:none;margin-bottom:2px}
.med.open .chev{transform:rotate(180deg)}
.detail{border-top:1px dashed var(--line);padding:6px 16px 16px;animation:fade .25s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;font-weight:600;padding:10px 0 4px}
.items{list-style:none;margin:0;padding:0;display:grid}
.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.tick{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid #C7D3D9;background:#fff;
  display:grid;place-items:center;color:transparent;padding:0;margin-top:1px}
button.tick{cursor:pointer;transition:transform .12s}
button.tick:active{transform:scale(.9)}
.tick.on{background:var(--gr);border-color:var(--gr);color:#fff}
.tick.half{border-color:var(--cy);background:linear-gradient(90deg,var(--cy) 50%,#fff 50%)}
.ibody{flex:1;min-width:0}
.idesc{font-weight:650;font-size:15.5px;overflow-wrap:anywhere}
.ideliv{margin-top:8px;font-size:13px;color:var(--mut)}
.ideliv b{color:var(--ink)}
.ideliv .mini{margin-top:6px}
.ivals{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:9px;font-size:13px;color:var(--mut)}
.ivals b{color:var(--ink);font-weight:650}
.ivals .tot{margin-left:auto;color:var(--ink);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;align-items:center;background:#F3F8FA;border-radius:14px;padding:13px 14px;margin-top:6px}
.sum span{color:var(--mut);font-weight:600;font-size:14px}
.sum b{font-size:19px;font-variant-numeric:tabular-nums}
.actions{display:grid;gap:8px;margin-top:12px}
.empty{text-align:center;color:var(--mut);padding:44px 20px}
.empty .ic{width:64px;height:64px;border-radius:50%;background:var(--cy-l);color:var(--cy-d);display:grid;place-items:center;margin:0 auto 14px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* ---------- Admin ---------- */
.stack{display:grid;gap:12px}
.card h3{font-size:16px;margin-bottom:4px}
.card p.d{color:var(--mut);font-size:13.5px;margin-bottom:12px}
.bigact{width:100%;display:flex;align-items:center;gap:14px;text-align:left;border:0;cursor:pointer;color:#fff;
  padding:18px;border-radius:22px;background:linear-gradient(135deg,var(--gr),#13903A);
  box-shadow:0 14px 26px -14px rgba(31,184,74,.9)}
.bigact .pl{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.bigact b{display:block;font-size:18px}
.bigact span{font-size:13.5px;opacity:.92}
.inline{display:flex;gap:10px}
.inline .fld{flex:1}
.linkbox{margin-top:12px;display:none}
.linkbox.on{display:block}
.linkbox textarea{width:100%;height:84px;border:1.5px solid var(--line);border-radius:12px;padding:10px;font:13px/1.3 ui-monospace,Menlo,monospace;resize:none;color:var(--mut);background:#F8FBFC}
.btnrow{display:flex;gap:10px;margin-top:10px}
.btnrow .btn{flex:1}
.small-note{font-size:12.5px;color:var(--mut);margin-top:10px}

/* ---------- Botões / campos ---------- */
.btn{height:50px;border-radius:14px;border:0;padding:0 18px;font-weight:650;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--cy),var(--cy-d));color:#fff;box-shadow:0 10px 20px -12px var(--cy-d)}
.btn.green{background:var(--gr);color:#fff}
.btn.green-o{background:var(--gr-l);color:var(--gr-d)}
.btn.ghost{background:#EEF3F5;color:var(--ink)}
.btn.danger{background:#FDECEA;color:#C0392B}
.btn.sm{height:42px;font-size:15px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;font-weight:650;color:var(--mut);margin-bottom:6px}
.fld>span em{font-style:normal;font-weight:500}
.fld input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font-size:16px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
.fld input:focus{border-color:var(--cy);box-shadow:0 0 0 4px rgba(15,169,209,.15)}
.fld input.bad{border-color:#E0533F;box-shadow:0 0 0 4px rgba(224,83,63,.12)}

/* ---------- Tab bar / FAB ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar-in{display:flex;max-width:640px;margin:0 auto}
.tab{flex:1;border:0;background:none;padding:9px 4px 8px;display:grid;justify-items:center;gap:3px;color:#8A9AA3;font-size:11.5px;font-weight:650;cursor:pointer;position:relative}
.tab.on{color:var(--cy-d)}
.tab .ico{width:44px;height:28px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.tab.on .ico{background:var(--cy-l)}
.tab .cnt{position:absolute;top:4px;left:calc(50% + 10px);background:var(--or);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;right:16px;bottom:calc(78px + var(--safe-b));z-index:25;border:0;cursor:pointer;color:#fff;
  height:54px;padding:0 20px 0 16px;border-radius:99px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;
  background:linear-gradient(135deg,var(--gr),#13903A);box-shadow:0 14px 26px -10px rgba(31,184,74,.9)}

/* ---------- Sheets ---------- */
#sheetRoot{position:fixed;inset:0;z-index:50;display:none}
#sheetRoot.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,25,32,.5);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;
  max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
.sheet.full{height:92vh;height:92dvh}
.grab{width:42px;height:5px;border-radius:9px;background:#D5DEE3;margin:9px auto 4px;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px;flex:none}
.sh-head h2{font-size:20px;letter-spacing:-.02em}
.x{border:0;background:#EEF3F5;width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--mut)}
.x.txt{width:auto;height:auto;background:none;color:#C0392B;font-size:13px;font-weight:650;padding:4px 2px}
.sh-body{overflow:auto;padding:4px 20px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}
.sh-foot{padding:12px 20px 14px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex:none}
.sh-foot .tt small{display:block;color:var(--mut);font-size:12px}
.sh-foot .tt b{font-size:20px;font-variant-numeric:tabular-nums}
.sh-foot .tt small.warn{color:#C0392B;font-weight:650}
.dt{display:flex;gap:12px;align-items:center;background:var(--cy-l);color:var(--cy-d);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.dt small{display:block;font-size:12px;opacity:.85}
.dt b{font-size:15px}
.ditem{border:1.5px solid var(--line);border-radius:18px;padding:14px 14px 4px;margin-bottom:12px;background:#FBFDFE}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dh b{font-size:14px;color:var(--cy-d)}
.trio{display:grid;grid-template-columns:.8fr 1fr 1.3fr;gap:8px}
.trio .fld input{padding:0 10px}
.dtot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding:10px 0 12px;font-size:14px;color:var(--mut)}
.dtot b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.addbtn{width:100%;margin-bottom:6px}
.dname{font-size:18px;font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}
.muted{color:var(--mut);font-size:14px;margin-bottom:16px}
.muted b{color:var(--ink)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#C0392B;font-size:13.5px;font-weight:600;min-height:20px;margin:-4px 0 6px}
.shake{animation:shake .35s}

#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:#14232B;color:#fff;
  padding:12px 18px;border-radius:99px;font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;z-index:80;
  transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.sheet{bottom:24px;border-radius:26px}.sheet.full{height:86vh}}
</style>
</head>

<script>
(() => {
'use strict';

/* ================= Configuração ================= */
const KEY  = 'lift_energisa_medicoes_v1';
const SKEY = 'lift_energisa_admin_v1';
const PASS_HASH = 5860898005348005;         // hash de verificação da senha (não guarda o texto da senha)
const VALOR_INICIAL = 21716;                // adiantamento inicial (editável no modo administrador)

/* ================= Utilidades ================= */
const $  = (s, r = document) => r.querySelector(s);
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const num = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 3 });
const r2  = n => Math.round((n + Number.EPSILON) * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPct = n => n.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const fmtDate = iso => {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' · ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function parseNum(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').replace(/[^\d.,-]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
function hashStr(s) {                         // cyrb53
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0, ch; i < s.length; i++) {
    ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}

const ic = (p, s = 22, w = 2) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  check: ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 18, 3),
  chev:  ic('<path d="M6 9l6 6 6-6"/>', 22),
  home:  ic('<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>'),
  list:  ic('<path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/>'),
  lock:  ic('<rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  unlock:ic('<rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7"/>'),
  plus:  ic('<path d="M12 5v14M5 12h14"/>', 26, 2.6),
  close: ic('<path d="M6 6l12 12M18 6L6 18"/>', 18, 2.4),
  clock: ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', 22),
  doc:   ic('<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>', 30, 1.8)
};

/* ================= Dados ================= */
let S = load() || { total: VALOR_INICIAL, medicoes: [], updatedAt: null, seq: 0 };
const ui = { tab: 'resumo', filter: 'todas', open: null, admin: false };
try { ui.admin = sessionStorage.getItem(SKEY) === '1'; } catch (e) {}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.medicoes)) return s;
  } catch (e) {}
  return null;
}
function save(touch = true) {
  if (touch) S.updatedAt = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

/* ---- cálculos ---- */
const itTotal  = i => r2(i.qtd * i.vu);
const medTotal = m => r2(m.itens.reduce((a, i) => a + i.qtd * i.vu, 0));
const medEnt   = m => r2(m.itens.reduce((a, i) => a + Math.min(i.ent, i.qtd) * i.vu, 0));
const isFull   = i => i.ent >= i.qtd - 1e-9;
const status = m => {
  if (m.itens.every(isFull)) return 'total';
  return m.itens.some(i => i.ent > 0) ? 'parcial' : 'entregar';
};
const STATUS = {
  entregar: { t: 'A entregar',            c: 'st-a' },
  parcial:  { t: 'Parcialmente entregue', c: 'st-p' },
  total:    { t: 'Totalmente entregue',   c: 'st-t' }
};
const summary = m => {
  if (m.titulo) return m.titulo;
  const d = m.itens.map(i => i.desc);
  return d.length <= 2 ? d.join(' · ') : d.slice(0, 2).join(' · ') + ' +' + (d.length - 2);
};
function totals() {
  const med = r2(S.medicoes.reduce((a, m) => a + medTotal(m), 0));
  const ent = r2(S.medicoes.reduce((a, m) => a + medEnt(m), 0));
  return { med, ent, rest: r2(S.total - med), pct: S.total > 0 ? med / S.total * 100 : 0 };
}
const find = id => S.medicoes.find(m => m.id === id);

/* ---- compartilhamento por link (sem servidor) ---- */
const pack = () => ({
  t: S.total, u: S.updatedAt, s: S.seq,
  m: S.medicoes.map(m => [m.id, m.n, m.data, m.titulo || '', m.itens.map(i => [i.desc, i.un, i.qtd, i.vu, i.ent])])
});
const unpack = d => ({
  total: d.t, updatedAt: d.u, seq: d.s || d.m.length,
  medicoes: d.m.map(x => ({ id: x[0], n: x[1], data: x[2], titulo: x[3], itens: x[4].map(i => ({ desc: i[0], un: i[1], qtd: i[2], vu: i[3], ent: i[4] })) }))
});
const b64u = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = str => { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; return Uint8Array.from(atob(str), c => c.charCodeAt(0)); };
async function encodeData(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window) {
    const cs = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return 'z' + b64u(new Uint8Array(await new Response(cs).arrayBuffer()));
  }
  return 'j' + b64u(raw);
}
async function decodeData(str) {
  let bytes = unb64u(str.slice(1));
  if (str[0] === 'z') {
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(ds).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function importFromHash() {
  const m = location.hash.match(/^#d=(.+)$/);
  if (!m) return false;
  try {
    const inc = unpack(await decodeData(m[1]));
    const localTs = S.updatedAt ? Date.parse(S.updatedAt) : 0;
    const inTs = inc.updatedAt ? Date.parse(inc.updatedAt) : 0;
    if (inTs >= localTs) { S = inc; save(false); }
    history.replaceState(null, '', location.pathname + location.search);
    return true;
  } catch (e) { toast('Não foi possível abrir este link.'); return false; }
}

/* ================= Telas ================= */
const app = $('#app');

function render() {
  app.innerHTML = ui.tab === 'resumo' ? viewResumo() : ui.tab === 'med' ? viewMed() : viewAdmin();
  const pend = S.medicoes.filter(m => status(m) !== 'total').length;
  $('#tabResumo').className = 'tab' + (ui.tab === 'resumo' ? ' on' : '');
  $('#tabMed').className    = 'tab' + (ui.tab === 'med' ? ' on' : '');
  $('#tabAdmin').className  = 'tab' + (ui.tab === 'admin' ? ' on' : '');
  $('#tabResumo').innerHTML = `<span class="ico">${ICON.home}</span>Resumo`;
  $('#tabMed').innerHTML    = `<span class="ico">${ICON.list}</span>Medições${pend ? `<span class="cnt">${pend}</span>` : ''}`;
  $('#tabAdmin').innerHTML  = `<span class="ico">${ui.admin ? ICON.unlock : ICON.lock}</span>Admin`;
  $('#fab').hidden = !(ui.admin && ui.tab !== 'admin');
}

function viewResumo() {
  const t = totals(), over = t.rest < 0;
  const cnt = { entregar: 0, parcial: 0, total: 0 };
  S.medicoes.forEach(m => cnt[status(m)]++);
  const pEnt = t.med > 0 ? t.ent / t.med * 100 : 0;
  return `
  <div class="ttl"><h1>Resumo</h1>${ui.admin ? `<span class="adm-tag">${ICON.unlock.replace(/width="22" height="22"/, 'width="14" height="14"')} Administrador</span>` : '<small>Acompanhamento do adiantamento</small>'}</div>
  <section class="hero">
    <div class="hero-top"><span class="eyebrow">Valor Total</span><span class="pill">Adiantamento</span></div>
    <div class="hero-val">${brl.format(S.total)}</div>
    <div class="prog ${over ? 'over' : ''}">
      <div class="prog-bar"><i style="width:${Math.min(100, Math.max(0, t.pct)).toFixed(2)}%"></i></div>
      <div class="prog-meta"><span><b>${fmtPct(t.pct)}</b> utilizado</span><span>${over ? 'Valor excedido' : 'Saldo ' + brl.format(t.rest)}</span></div>
    </div>
  </section>
  <div class="grid2">
    <div class="card stat"><small><i class="dot cy"></i>Já medido</small><strong>${brl.format(t.med)}</strong><em>${S.medicoes.length} ${S.medicoes.length === 1 ? 'medição lançada' : 'medições lançadas'}</em></div>
    <div class="card stat"><small><i class="dot or"></i>A medir</small><strong>${brl.format(Math.max(0, t.rest))}</strong><em>${over ? 'Excedeu em ' + brl.format(-t.rest) : fmtPct(Math.max(0, 100 - t.pct)) + ' do valor total'}</em></div>
  </div>
  <div class="card deliv">
    <div class="row"><h3>Entregue</h3><b class="v">${brl.format(t.ent)}</b></div>
    <div class="mini"><i style="width:${pEnt.toFixed(2)}%"></i></div>
    <div class="chips3">
      <span class="c-a">${cnt.entregar} a entregar</span>
      <span class="c-p">${cnt.parcial} parcial</span>
      <span class="c-t">${cnt.total} concluída${cnt.total === 1 ? '' : 's'}</span>
    </div>
  </div>
  ${S.updatedAt ? `<p class="foot">Atualizado em ${fmtDate(S.updatedAt)}</p>` : ''}`;
}

function viewMed() {
  const all = [...S.medicoes].sort((a, b) => b.data.localeCompare(a.data));
  const pend = all.filter(m => status(m) !== 'total'), conc = all.filter(m => status(m) === 'total');
  const list = ui.filter === 'pend' ? pend : ui.filter === 'conc' ? conc : all;
  const chip = (k, l, n) => `<button class="chip ${ui.filter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${l} (${n})</button>`;
  return `
  <div class="ttl"><h1>Medições</h1>${ui.admin ? `<span class="adm-tag">Administrador</span>` : '<small>Histórico</small>'}</div>
  <div class="filters">${chip('todas', 'Todas', all.length)}${chip('pend', 'Pendentes', pend.length)}${chip('conc', 'Concluídas', conc.length)}</div>
  ${list.length ? `<div class="list">${list.map(medCard).join('')}</div>` : `
    <div class="empty"><div class="ic">${ICON.doc}</div>
      <b>${all.length ? 'Nada por aqui' : 'Nenhuma medição lançada'}</b>
      ${all.length ? 'Nenhuma medição neste filtro.' : 'As medições aparecerão aqui assim que forem lançadas.'}</div>`}`;
}

function medCard(m) {
  const st = STATUS[status(m)], tot = medTotal(m), ent = medEnt(m), open = ui.open === m.id;
  const pct = tot > 0 ? ent / tot * 100 : 0, done = m.itens.filter(isFull).length;
  return `
  <article class="med ${open ? 'open' : ''}">
    <div class="med-head" role="button" tabindex="0" aria-expanded="${open}" data-act="toggle" data-id="${m.id}">
      <div class="row1"><span class="date">${fmtDate(m.data)}</span><span class="badge ${st.c}">${st.t}</span></div>
      <h3>${esc(summary(m))}</h3>
      <div class="row2">
        <div class="a"><small>Valor total</small><b>${brl.format(tot)}</b></div>
        <div class="b"><small>${done}/${m.itens.length} ${m.itens.length === 1 ? 'item entregue' : 'itens entregues'}</small><div class="mini"><i style="width:${pct.toFixed(1)}%"></i></div></div>
        <span class="chev">${ICON.chev}</span>
      </div>
    </div>
    ${open ? medDetail(m) : ''}
  </article>`;
}

function medDetail(m) {
  return `
  <div class="detail">
    <div class="meta"><span>Medição nº ${String(m.n).padStart(2, '0')}</span><span>${fmtDate(m.data)}</span></div>
    <ul class="items">${m.itens.map((i, k) => itemRow(m, i, k)).join('')}</ul>
    <div class="sum"><span>Total da medição</span><b>${brl.format(medTotal(m))}</b></div>
    ${ui.admin ? `<div class="actions">
      <button class="btn green" data-act="deliverAll" data-id="${m.id}">${ICON.check} Entregar todos os itens</button>
      <button class="btn danger sm" data-act="delMed" data-id="${m.id}">Excluir medição</button>
    </div>` : ''}
  </div>`;
}

function itemRow(m, i, k) {
  const full = isFull(i), part = !full && i.ent > 0, p = i.qtd > 0 ? Math.min(100, i.ent / i.qtd * 100) : 0;
  const cls = full ? 'on' : part ? 'half' : '';
  const mark = ui.admin
    ? `<button class="tick ${cls}" data-act="deliver" data-id="${m.id}" data-k="${k}" aria-label="Informar entrega do item">${ICON.check}</button>`
    : `<span class="tick ${cls}" aria-hidden="true">${ICON.check}</span>`;
  return `
  <li class="item">
    ${mark}
    <div class="ibody">
      <div class="idesc">${esc(i.desc)}</div>
      <div class="ideliv"><b>${num.format(i.ent)}</b> de <b>${num.format(i.qtd)}</b> ${esc(i.un)} entregues<div class="mini"><i style="width:${p.toFixed(1)}%"></i></div></div>
      <div class="ivals"><span>Unidade: <b>${esc(i.un)}</b></span><span>Unitário: <b>${brl.format(i.vu)}</b></span><span class="tot">${brl.format(itTotal(i))}</span></div>
    </div>
  </li>`;
}

function viewAdmin() {
  const canShare = location.protocol !== 'file:';
  return `
  <div class="ttl"><h1>Administrador</h1><span class="adm-tag">Acesso ativo</span></div>
  <div class="stack">
    <button class="bigact" data-act="newMed"><span class="pl">${ICON.plus}</span><div><b>Lançar nova medição</b><span>Adicione os itens, quantidades e valores</span></div></button>

    <div class="card">
      <h3>Valor Total do adiantamento</h3>
      <p class="d">Base de cálculo do resumo (atualmente ${brl.format(S.total)}).</p>
      <div class="inline"><label class="fld"><span>Novo valor (R$)</span><input id="totIn" inputmode="decimal" value="${String(S.total).replace('.', ',')}"></label>
      <div style="padding-top:25px"><button class="btn ghost" data-act="saveTotal">Salvar</button></div></div>
    </div>

    <div class="card">
      <h3>Compartilhar com o cliente</h3>
      <p class="d">Gera um link com o estado atual das medições. Quem abrir o link vê tudo (somente leitura). Após novos lançamentos ou entregas, gere e envie o link atualizado.</p>
      <button class="btn primary" data-act="genLink" style="width:100%">Gerar link para o cliente</button>
      <div class="linkbox" id="linkBox">
        <textarea id="linkTxt" readonly></textarea>
        <div class="btnrow"><button class="btn ghost sm" data-act="copyLink">Copiar</button><button class="btn green-o sm" data-act="shareLink">Enviar…</button></div>
      </div>
      ${canShare ? '' : '<p class="small-note">Atenção: este arquivo está aberto direto do aparelho. Para o link funcionar no celular do cliente, publique o arquivo em uma hospedagem gratuita (ex.: Netlify Drop, GitHub Pages ou Cloudflare Pages).</p>'}
    </div>

    <div class="card">
      <h3>Backup dos dados</h3>
      <p class="d">Os dados ficam salvos neste navegador. Exporte um backup para guardar ou levar para outro aparelho.</p>
      <div class="btnrow" style="margin-top:0"><button class="btn ghost sm" data-act="export">Exportar</button><button class="btn ghost sm" data-act="import">Importar</button></div>
    </div>

    <button class="btn ghost" data-act="logout">Sair do modo administrador</button>
  </div>`;
}

/* ================= Sheets ================= */
let clock = null, draft = null, ctx = null;

function openSheet(html, { full = false, dismiss = true } = {}) {
  const r = $('#sheetRoot');
  r.innerHTML = `<div class="scrim" ${dismiss ? 'data-act="closeSheet"' : ''}></div><div class="sheet ${full ? 'full' : ''}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  r.classList.add('on');
  document.body.classList.add('lock');
}
function closeSheet() {
  const r = $('#sheetRoot');
  r.classList.remove('on'); r.innerHTML = '';
  document.body.classList.remove('lock');
  clearInterval(clock); clock = null; draft = null; ctx = null;
}
const head = t => `<div class="sh-head"><h2>${t}</h2><button class="x" data-act="closeSheet" aria-label="Fechar">${ICON.close}</button></div>`;

/* ---- login ---- */
function openLogin() {
  openSheet(`${head('Área do administrador')}
    <div class="sh-body">
      <p class="muted">Digite a senha para lançar medições e registrar entregas.</p>
      <label class="fld"><span>Senha</span><input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <div class="err" id="pwErr"></div>
    </div>
    <div class="sh-foot"><button class="btn primary" style="flex:1" data-act="login">Entrar</button></div>`);
  setTimeout(() => $('#pw') && $('#pw').focus(), 250);
}
function doLogin() {
  const v = $('#pw').value;
  if (hashStr(v) === PASS_HASH) {
    ui.admin = true; try { sessionStorage.setItem(SKEY, '1'); } catch (e) {}
    closeSheet(); ui.tab = 'admin'; render(); window.scrollTo(0, 0); toast('Modo administrador ativado');
  } else {
    $('#pwErr').textContent = 'Senha incorreta. Tente novamente.';
    const i = $('#pw'); i.classList.add('bad', 'shake'); i.value = '';
    setTimeout(() => i.classList.remove('shake'), 400);
  }
}

/* ---- nova medição ---- */
function openNewMed() {
  draft = { titulo: '', itens: [{ desc: '', un: '', qtd: '', vu: '' }] };
  openSheet(`${head('Nova medição')}
    <div class="sh-body" id="shBody">
      <div class="dt">${ICON.clock}<div><small>Data e hora (preenchidas automaticamente)</small><b id="nowTxt"></b></div></div>
      <label class="fld"><span>Título da solicitação <em>(opcional)</em></span><input id="mTitulo" placeholder="Ex.: Kit EPI – Equipe Norte" autocomplete="off"></label>
      <div id="itemsBox"></div>
      <button class="btn ghost addbtn" data-act="addItem">+ Adicionar item</button>
      <datalist id="units"><option value="un"><option value="par"><option value="cx"><option value="kit"><option value="pç"><option value="m"><option value="kg"><option value="h"><option value="vb"></datalist>
    </div>
    <div class="sh-foot">
      <div class="tt"><small>Total da medição</small><b id="mTotal">R$ 0,00</b><small id="mWarn"></small></div>
      <button class="btn primary" data-act="saveMed">Lançar medição</button>
    </div>`, { full: true, dismiss: false });
  const tick = () => { const n = $('#nowTxt'); if (n) n.textContent = fmtDate(new Date().toISOString()); };
  tick(); clock = setInterval(tick, 20000);
  renderDraft(); recalcDraft();
}
function renderDraft() {
  $('#itemsBox').innerHTML = draft.itens.map((it, k) => `
    <div class="ditem">
      <div class="dh"><b>Item ${k + 1}</b>${draft.itens.length > 1 ? `<button class="x txt" data-act="rmItem" data-k="${k}">Remover</button>` : ''}</div>
      <label class="fld"><span>Descrição</span><input data-f="desc" data-k="${k}" value="${esc(it.desc)}" placeholder="Ex.: Capacete de segurança" autocomplete="off"></label>
      <div class="trio">
        <label class="fld"><span>Unidade</span><input data-f="un" data-k="${k}" list="units" value="${esc(it.un)}" placeholder="un" autocomplete="off" autocapitalize="off"></label>
        <label class="fld"><span>Qtd.</span><input data-f="qtd" data-k="${k}" inputmode="decimal" value="${esc(it.qtd)}" placeholder="0" autocomplete="off"></label>
        <label class="fld"><span>Valor unit. (R$)</span><input data-f="vu" data-k="${k}" inputmode="decimal" value="${esc(it.vu)}" placeholder="0,00" autocomplete="off"></label>
      </div>
      <div class="dtot"><span>Total do item</span><b data-tot="${k}">R$ 0,00</b></div>
    </div>`).join('');
  recalcDraft();
}
function recalcDraft() {
  if (!draft) return;
  let tot = 0;
  draft.itens.forEach((it, k) => {
    const q = parseNum(it.qtd), v = parseNum(it.vu);
    const t = isFinite(q) && isFinite(v) ? r2(q * v) : 0;
    tot += t;
    const el = $(`[data-tot="${k}"]`); if (el) el.textContent = brl.format(t);
  });
  tot = r2(tot);
  $('#mTotal').textContent = brl.format(tot);
  const after = r2(S.total - totals().med - tot), w = $('#mWarn');
  w.textContent = after < 0 ? `Excede o saldo em ${brl.format(-after)}` : `Saldo após lançar: ${brl.format(after)}`;
  w.className = after < 0 ? 'warn' : '';
}
function saveMed() {
  let ok = true, first = null;
  const itens = draft.itens.map((it, k) => {
    const q = parseNum(it.qtd), v = parseNum(it.vu), d = it.desc.trim();
    const mark = (f, bad) => { const el = $(`[data-f="${f}"][data-k="${k}"]`); if (el) el.classList.toggle('bad', bad); if (bad) { ok = false; first = first || el; } };
    mark('desc', !d); mark('qtd', !(q > 0)); mark('vu', !(v >= 0));
    return { desc: d, un: (it.un.trim() || 'un'), qtd: q, vu: v, ent: 0 };
  });
  if (!ok) { toast('Preencha descrição, quantidade e valor de todos os itens'); first && first.focus(); return; }
  S.seq = (S.seq || S.medicoes.length) + 1;
  const m = { id: uid(), n: S.seq, data: new Date().toISOString(), titulo: ($('#mTitulo').value || '').trim(), itens };
  S.medicoes.push(m); save();
  closeSheet(); ui.tab = 'med'; ui.filter = 'todas'; ui.open = m.id; render(); window.scrollTo(0, 0);
  toast('Medição lançada e visível para todos');
}

/* ---- entrega por item ---- */
function openDeliver(id, k) {
  const m = find(id); if (!m) return; const it = m.itens[k];
  ctx = { id, k };
  openSheet(`${head('Informar entrega')}
    <div class="sh-body">
      <div class="dname">${esc(it.desc)}</div>
      <p class="muted">Quantidade total: <b>${num.format(it.qtd)} ${esc(it.un)}</b> · Já entregue: <b>${num.format(it.ent)}</b></p>
      <label class="fld"><span>Quantos (${esc(it.un)}) foram entregues?</span><input id="dQty" inputmode="decimal" value="${it.ent ? String(it.ent).replace('.', ',') : ''}" placeholder="0"></label>
      <div class="err" id="dErr"></div>
      <div class="quick"><button class="btn green-o" data-act="dAll">Todos (${num.format(it.qtd)})</button><button class="btn ghost" data-act="dNone">Zerar</button></div>
    </div>
    <div class="sh-foot"><button class="btn primary" style="flex:1" data-act="dSave">Salvar entrega</button></div>`);
}
function applyDelivery(val) {
  const m = find(ctx.id), it = m.itens[ctx.k];
  if (!isFinite(val) || val < 0) { $('#dErr').textContent = 'Informe uma quantidade válida.'; return; }
  if (val > it.qtd + 1e-9) { $('#dErr').textContent = `Máximo permitido: ${num.format(it.qtd)} ${it.un}.`; return; }
  it.ent = Math.min(val, it.qtd); save(); closeSheet(); render(); toast('Entrega atualizada');
}

/* ---- demais ações ---- */
function deliverAll(id) {
  const m = find(id); if (!m) return;
  m.itens.forEach(i => i.ent = i.qtd); save(); render(); toast('Todos os itens marcados como entregues');
}
function openDelete(id) {
  const m = find(id); if (!m) return; ctx = { id };
  openSheet(`${head('Excluir medição?')}
    <div class="sh-body"><p class="muted">A medição <b>nº ${String(m.n).padStart(2, '0')}</b> (${brl.format(medTotal(m))}) será removida do histórico e do resumo. Esta ação não pode ser desfeita.</p></div>
    <div class="sh-foot"><button class="btn ghost" style="flex:1" data-act="closeSheet">Cancelar</button><button class="btn danger" style="flex:1" data-act="delOk">Excluir</button></div>`);
}

let lastLink = '';
async function genLink() {
  const btn = $('[data-act="genLink"]'); btn.textContent = 'Gerando…';
  try {
    lastLink = location.href.split('#')[0] + '#d=' + await encodeData(pack());
    $('#linkTxt').value = lastLink; $('#linkBox').classList.add('on');
    btn.textContent = 'Gerar link novamente';
  } catch (e) { btn.textContent = 'Gerar link para o cliente'; toast('Não foi possível gerar o link'); }
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  const ta = $('#linkTxt'); ta.focus(); ta.select();
  try { return document.execCommand('copy'); } catch (e) { return false; }
}

/* ================= Eventos ================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case 'tab':
      if (t.dataset.tab === 'admin' && !ui.admin) { openLogin(); break; }
      ui.tab = t.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'filter': ui.filter = t.dataset.f; render(); break;
    case 'toggle': ui.open = ui.open === id ? null : id; render(); break;
    case 'closeSheet': closeSheet(); break;
    case 'login': doLogin(); break;
    case 'logout':
      ui.admin = false; try { sessionStorage.removeItem(SKEY); } catch (e2) {}
      ui.tab = 'resumo'; render(); window.scrollTo(0, 0); toast('Você saiu do modo administrador'); break;
    case 'newMed': openNewMed(); break;
    case 'addItem':
      draft.itens.push({ desc: '', un: '', qtd: '', vu: '' }); renderDraft();
      { const b = $('#shBody'); b.scrollTop = b.scrollHeight; } break;
    case 'rmItem': draft.itens.splice(+t.dataset.k, 1); renderDraft(); break;
    case 'saveMed': saveMed(); break;
    case 'deliver': openDeliver(id, +t.dataset.k); break;
    case 'dAll': applyDelivery(find(ctx.id).itens[ctx.k].qtd); break;
    case 'dNone': applyDelivery(0); break;
    case 'dSave': applyDelivery(parseNum($('#dQty').value || '0')); break;
    case 'deliverAll': deliverAll(id); break;
    case 'delMed': openDelete(id); break;
    case 'delOk':
      S.medicoes = S.medicoes.filter(m => m.id !== ctx.id); if (ui.open === ctx.id) ui.open = null;
      save(); closeSheet(); render(); toast('Medição excluída'); break;
    case 'saveTotal': {
      const v = parseNum($('#totIn').value);
      if (!(v > 0)) { toast('Informe um valor válido'); break; }
      S.total = r2(v); save(); render(); toast('Valor Total atualizado'); break;
    }
    case 'genLink': genLink(); break;
    case 'copyLink': toast(await copyText(lastLink) ? 'Link copiado' : 'Selecione e copie o link manualmente'); break;
    case 'shareLink':
      if (navigator.share) { try { await navigator.share({ title: 'Medições · Lift EPI × Energisa', text: 'Acompanhe as medições do adiantamento:', url: lastLink }); } catch (e2) {} }
      else toast(await copyText(lastLink) ? 'Link copiado' : 'Selecione e copie o link manualmente');
      break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob), el = document.createElement('a');
      el.href = url; el.download = 'medicoes-lift-energisa.json'; document.body.appendChild(el); el.click(); el.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Backup exportado'); break;
    }
    case 'import': $('#fileIn').click(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'pw') { e.preventDefault(); doLogin(); }
  if (e.key === 'Enter' && e.target.id === 'dQty') { e.preventDefault(); applyDelivery(parseNum(e.target.value || '0')); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('med-head')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && $('#sheetRoot').classList.contains('on')) closeSheet();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pw') { t.classList.remove('bad'); $('#pwErr').textContent = ''; }
  if (t.id === 'dQty') $('#dErr').textContent = '';
  if (draft && t.dataset && t.dataset.f) {
    draft.itens[+t.dataset.k][t.dataset.f] = t.value; t.classList.remove('bad'); recalcDraft();
  }
});
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.medicoes) || !isFinite(d.total)) throw 0;
      S = d; save(false); render(); toast('Backup importado');
    } catch (err) { toast('Arquivo de backup inválido'); }
  };
  rd.readAsText(f); e.target.value = '';
});

let tmr;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tmr); tmr = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ================= Início ================= */
(async () => {
  document.querySelector('link[rel="icon"]').href = $('#logoLift').src;
  await importFromHash();
  render();
  window.addEventListener('hashchange', async () => { if (await importFromHash()) render(); });
})();
})();
</script>
</body>
</html>
